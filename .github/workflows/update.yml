name: Update profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - projects.json
      - scripts/**
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Build README and assets
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#22d3ee&color_dots=#1b2140,#4c3a8f,#7c5cf0,#c084fc,#f472b6

      - name: Install snake into assets
        run: |
          if [ -f dist/snake.svg ]; then cp dist/snake.svg assets/snake.svg; fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh profile"
            git push
          fi
